# 周期总结调度配置（run-once）
# 建议由系统任务计划每 N 分钟触发一次：
# python scripts/schedule_report.py --config config/report_schedule.yaml

interval_minutes: 60
chatroom: 牛市来了，一定要学更多
decrypted_dir:

output_dir: outputs/reports
work_dir: runtime/hourly
output_format: md

align_mode: floor
min_messages: 5
# 逗号分隔的重点成员昵称或微信 ID；其含催化剂、链接、合约地址等证据的消息会被优先展示
# focus_members: Alice,Bob
# 低活跃整窗跳过（0 关闭）：0 < 消息条数 < 阈值时不跑 AI/报告，可选发飞书短讯；若阈值 >= min_messages，则 min_messages 精简分支对正计数窗口永不生效（启动时 stderr 警告）
# low_activity_skip_threshold: 50
# low_activity_skip_message: "【跳过】{chatroom} {start}-{end} 共 {total_count} 条 < {threshold}"
retry_times: 1
skip_refresh: false

# 单次进程最多补跑窗口数（停机后积压）
max_catchup_windows: 24

provider: cursor_cli
provider_timeout_seconds: 180
analyze_timeout_seconds: 600
report_timeout_seconds: 300
max_chat_chars: 200000

# 发送通道（none | feishu_cli_webhook | feishu_cli_card | feishu_im_api）
sender: feishu_cli_webhook
sender_timeout_seconds: 30
sender_retry_times: 1
sender_retry_backoff_seconds: 2
sender_strict: false
sender_config_file: config/senders.json
feishu_message_max_chars: 3000

lock_file: runtime/schedule_report.lock
lock_ttl_seconds: 600
state_file: runtime/state.json

